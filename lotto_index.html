<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 번호 생성기</title>
<style>
  body {
    font-family: "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    margin: 0;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px 24px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 24px;
    color: #222;
  }
  button {
    background: #4a90d9;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 24px;
    width: 100%;
  }
  button:active { background: #3a7bc8; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid #eee;
  }
  .row:first-child { border-top: none; }
  .label {
    font-size: 13px;
    color: #999;
    width: 30px;
    flex-shrink: 0;
    text-align: left;
  }
  .balls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ball {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    color: white;
  }
</style>
</head>
<body>
<div class="card">
  <h1>로또 번호 생성기</h1>
  <button onclick="generateGames()">5게임 생성하기</button>
  <div id="results"></div>
</div>

<script>
function colorForNumber(n) {
  if (n <= 10) return { bg: "#FBC400", text: "#333" };
  if (n <= 20) return { bg: "#69C8F2", text: "#fff" };
  if (n <= 30) return { bg: "#FF7272", text: "#fff" };
  if (n <= 40) return { bg: "#AAAAAA", text: "#fff" };
  return { bg: "#B0D840", text: "#333" };
}

function generateOneGame() {
  const nums = [];
  while (nums.length < 6) {
    const n = Math.floor(Math.random() * 45) + 1;
    if (!nums.includes(n)) nums.push(n);
  }
  return nums.sort((a, b) => a - b);
}

function generateGames() {
  const container = document.getElementById("results");
  container.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    const game = generateOneGame();
    const row = document.createElement("div");
    row.className = "row";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "A" + (i + 1);
    row.appendChild(label);

    const balls = document.createElement("div");
    balls.className = "balls";
    game.forEach(n => {
      const c = colorForNumber(n);
      const ball = document.createElement("div");
      ball.className = "ball";
      ball.style.background = c.bg;
      ball.style.color = c.text;
      ball.textContent = n;
      balls.appendChild(ball);
    });
    row.appendChild(balls);
    container.appendChild(row);
  }
}

generateGames();
</script>
</body>
</html>
